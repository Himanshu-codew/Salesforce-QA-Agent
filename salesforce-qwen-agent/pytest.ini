[pytest]
# The canonical test suite lives under tests/. The scratch/ directory holds
# live-credential one-off debugging scripts (manual OAuth checks, SF host
# probes) that are NOT part of the suite: they are plain `async def` functions
# with no pytest-asyncio marks and require live credentials, so collecting
# them under a bare `pytest` only reports errors unrelated to the codebase.
# Keep those files (developers run them directly: `python scratch/test_x.py`)
# but exclude them from default collection so `pytest` reflects the real suite.
norecursedirs =
    scratch
    .git
    __pycache__
    .pytest_cache
    node_modules